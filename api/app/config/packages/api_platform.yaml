api_platform:
    title: Articles API
    description: Mini API de développement — articles et opérations CRUD.
    version: 1.0.0
    formats:
        jsonld: ['application/ld+json']
    patch_formats:
        json: ['application/merge-patch+json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
