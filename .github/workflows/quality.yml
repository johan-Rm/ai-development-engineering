name: Qualité
on:
  pull_request:
  push:
    branches: [develop, master]
permissions:
  contents: read
jobs:
  contribution:
    name: Contribution de confiance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: policy
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Choisir la source de confiance
        id: policy
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          APPROVED_POLICY_SHA: ${{ vars.DEM028_BOOTSTRAP_POLICY_SHA }}
        run: |
          if git -C policy cat-file -e "$COMMIT_BASE:codebase-integrity/scripts/check_contributions.py"; then
            echo 'bootstrap=false' >> "$GITHUB_OUTPUT"
          else
            if [[ ! "$APPROVED_POLICY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'Amorçage bloqué : commit approuvé explicitement requis.' >&2
              exit 1
            fi
            echo 'bootstrap=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.policy.outputs.bootstrap == 'true'
        with:
          ref: ${{ vars.DEM028_BOOTSTRAP_POLICY_SHA }}
          path: approved-policy
          fetch-depth: 0
          persist-credentials: false
      - name: Vérifier sans exécuter le candidat
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BOOTSTRAP: ${{ steps.policy.outputs.bootstrap }}
          DEM028_BOOTSTRAP_POLICY_SHA: ${{ vars.DEM028_BOOTSTRAP_POLICY_SHA }}
        run: |
          policy_dir=policy
          if [ "$BOOTSTRAP" = true ]; then policy_dir=approved-policy; fi
          python3 -I -B "$policy_dir/codebase-integrity/scripts/contribution.py" --repo "$GITHUB_WORKSPACE/candidate" --base "$COMMIT_BASE" --head "$COMMIT_HEAD"
  quality:
    needs: contribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Le candidat n'est exécuté que dans ce runner distinct, sans secrets ni écriture.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, xml
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 codebase-integrity/scripts/apps.py install all
      - name: Qualité et commits de la contribution
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DEM028_BOOTSTRAP_POLICY_SHA: ${{ vars.DEM028_BOOTSTRAP_POLICY_SHA }}
        run: python3 codebase-integrity/scripts/quality.py --commit-base "$COMMIT_BASE" --commit-head "$COMMIT_HEAD"
      - name: Installer Chromium
        working-directory: apps/web/targets/app
        run: npx playwright install --with-deps chromium
      - name: Parcours navigateur avec API locale
        shell: bash
        run: |
          python3 codebase-integrity/scripts/apps.py serve api > "$RUNNER_TEMP/aiod-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/api/articles > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/aiod-api.log"
            exit 1
          fi
          (cd apps/web/targets/app && npm run test:e2e)
          (cd apps/backoffice && npm run test:e2e)
