:root{--olive:#6B7A4A;--olive-pale:#DDE2CF;--olive-clair:#A8B97A;--olive-dark:#525E38;--pale:#F1F2E9;--paper:#FAFAF6;--ink:#212121;--gray:#4F4D4A;--line:#8A8884;--terra:#C07040;font-family:Inter,sans-serif;color:var(--ink);font-weight:300;background:var(--paper)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}button{font:inherit;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid var(--ink);outline-offset:4px}button:hover{filter:brightness(.94)}button[aria-expanded="true"]{filter:brightness(.9)}
.frame{height:100svh;min-height:550px;display:grid;grid-template-columns:64px minmax(0,1fr) 64px;grid-template-rows:56px minmax(0,1fr) 56px;border-radius:24px;background:var(--olive-pale);color:var(--ink);overflow:hidden}
.masthead{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:20px;padding:0 24px}.brand{display:flex;align-items:baseline;gap:22px;flex-wrap:wrap}.brand h1,.brand p{margin:0;font-family:Rationale,sans-serif;font-weight:400}.brand h1{font-size:44px}.brand p{font-size:30px}.subtitle{margin:7px 0 0;font-size:14px}
.theme{border:0;background:transparent;color:var(--paper);font-weight:500;letter-spacing:.11em;text-transform:uppercase;padding:14px;border-radius:10px;font-size:13px}.theme:hover,.theme[aria-expanded="true"]{background:var(--olive-dark);filter:none}.theme-left,.theme-right{align-self:stretch;justify-self:center;writing-mode:vertical-rl}.theme-left{transform:rotate(180deg)}.theme-bottom{grid-column:2;grid-row:3;justify-self:center;align-self:start}
.workspace{background:var(--paper);color:var(--ink);border-radius:18px;overflow:auto;container-type:inline-size;padding:26px;display:flex;flex-direction:column;gap:24px;min-width:0}.pilot{display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--olive-dark);font-size:13px}.pilot p{margin:0}.roles{display:flex;gap:10px}.roles span{border-radius:8px;padding:9px 20px;color:var(--paper)}.human{background:var(--olive);color:var(--paper)}.ai{background:var(--terra);color:var(--paper)}.artifact{background:var(--paper);color:var(--ink)}
.loops{display:grid;grid-template-columns:minmax(0,1fr) 100px minmax(0,1fr);align-items:center;flex:1;gap:12px}.loop{background:var(--pale);border-radius:18px;padding:22px;min-width:0}.loop h2{font:400 25px Rationale,sans-serif;margin:0 0 28px;text-transform:uppercase;min-height:60px}.cycle{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1fr);grid-template-rows:76px 82px 76px;align-items:center;gap:0}.action{border:0;border-radius:12px;padding:12px 7px;min-height:76px;width:100%;display:flex;flex-direction:column;justify-content:center;gap:5px;text-align:center}.action strong{font-size:17px;font-weight:500}.action span{font-size:12px;line-height:1.45}.arrow,.down{font-size:26px;text-align:center;color:var(--line);font-family:Arial,sans-serif}.return-note{grid-column:1/5;grid-row:2;text-align:center;font-size:12px;color:var(--gray)}.down{grid-column:5;grid-row:2}.bridge{text-align:center;color:var(--gray);font-size:12px;line-height:1.5}.bridge span{display:block;font:30px Arial,sans-serif;color:var(--line)}
.connections{display:flex;justify-content:space-between;gap:20px;color:var(--gray);font-size:12px}.connections p{margin:0}.controls{border:0;background:var(--pale);border-radius:12px;padding:17px 20px;text-align:center;color:var(--ink);width:100%}.controls strong{display:block;font-weight:500;font-size:14px}.controls span{display:block;margin-top:7px;font-size:12px;color:var(--gray)}.footnote{display:flex;justify-content:space-between;gap:14px;font-size:11px;color:var(--gray)}.footnote p{margin:0}.hint{color:var(--olive-dark)}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(390px,92vw);z-index:5;background:var(--paper);color:var(--ink);border-radius:24px 0 0 24px;padding:28px;overflow:auto;border-left:1px solid #DDE2CF}.panel[hidden]{display:none}.panel-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive-dark)}.close{border:0;border-radius:8px;background:var(--pale);padding:10px 13px;color:var(--ink)}.panel h2{font:400 36px Rationale,sans-serif;margin:32px 0 16px}.intro{font-size:16px;line-height:1.6;color:var(--gray)}.detail-list{padding:0;margin:28px 0;list-style:none}.detail-list li{margin-bottom:26px}.detail-list h3{font-size:15px;font-weight:500;margin:0 0 8px}.detail-list p{font-size:14px;color:var(--gray);line-height:1.7;margin:0}.panel-help{font-size:12px;color:var(--gray);line-height:1.6}
@container(max-width:1050px){.loops{grid-template-columns:1fr;gap:14px}.bridge{display:flex;gap:12px;align-items:center;justify-content:center}.bridge span{transform:rotate(90deg)}.loop h2{min-height:0;margin-bottom:20px}.cycle{grid-template-rows:72px 50px 72px}.action{min-height:72px}.footnote{flex-direction:column}.connections{flex-wrap:wrap}}
@media(max-width:850px){.frame{grid-template-columns:44px minmax(0,1fr) 44px}.masthead{padding:18px 20px;gap:10px}.brand{gap:8px}.brand h1{font-size:34px}.brand p{font-size:22px}.subtitle{font-size:12px}.theme{font-size:11px;padding:10px}.workspace{padding:16px;gap:20px}.pilot{flex-wrap:wrap}.roles span{padding:7px 14px}.loop{padding:15px}.loop h2{font-size:23px}.action strong{font-size:14px}.action span{font-size:11px}.cycle{grid-template-columns:minmax(0,1fr) 14px minmax(0,1fr) 14px minmax(0,1fr)}.arrow{font-size:20px}}
@media(prefers-reduced-motion:no-preference){button{transition:background-color .15s,filter .15s}}
.signature{grid-column:1/-1;grid-row:3;justify-self:end;align-self:end;margin:0 28px 8px;text-align:right;max-width:calc(100% - 40px);pointer-events:none}.signature h1{font:400 18px Rationale,sans-serif;margin:0 0 4px}.signature h1 span{margin-right:8px}.signature p{font-size:11px;line-height:1.5;margin:0}.explore-hint{font-size:11px;text-align:right;margin:0}
@media(max-width:850px){.masthead{padding:0 16px}.signature{margin-right:18px;margin-bottom:8px}.signature h1{font-size:16px}.signature p{font-size:10px}.frame{grid-template-rows:96px minmax(0,1fr) 96px}}
.loops{align-items:stretch}.loop{display:flex;flex-direction:column}.cycle{flex:1;grid-template-rows:minmax(76px,1fr) minmax(70px,.8fr) minmax(76px,1fr)}.action{height:100%}.bridge{align-self:center}.role-legend{grid-column:1/-1;grid-row:3;justify-self:start;align-self:end;margin:0 28px 14px;font-size:10px;gap:7px}.role-legend span{padding:5px 9px;border-radius:6px}
@container(max-width:1050px){.cycle{grid-template-rows:72px 50px 72px}}
@media(max-width:850px){.frame{grid-template-rows:96px minmax(0,1fr) 96px}.role-legend{align-self:start;margin:10px 0 0 18px}}
.coding-block{display:flex;flex-direction:column;gap:8px;min-width:0}.coding-block>.loop{flex:1}.cycle-entry,.cycle-exit{display:flex;flex-direction:column;align-items:center;gap:4px}.boundary{width:100%;border:0;border-radius:12px;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left}.boundary strong{font-size:15px;font-weight:500}.boundary span{font-size:12px}.boundary.artifact{background:var(--pale)}.boundary-arrow{color:var(--line);font:20px Arial,sans-serif;line-height:1}.coding-loop h2{min-height:0;margin-bottom:24px}
.coding-block{gap:0;background:var(--pale);border-radius:18px;overflow:hidden}.coding-block>.loop{border-radius:0;padding-top:16px;padding-bottom:16px}.cycle-entry,.cycle-exit{gap:0;flex:none}.boundary{border-radius:0;padding:9px 22px;min-height:34px}.boundary strong{font-size:12px}.cycle-exit .boundary{background:var(--pale)}.coding-loop h2{margin-bottom:16px}.coding-block .cycle{grid-template-rows:minmax(64px,1fr) minmax(44px,.6fr) minmax(64px,1fr)}.coding-block .action{min-height:64px}
@container(max-width:1050px){.coding-block .cycle{grid-template-rows:72px 50px 72px}}
/* La vue garde sa hauteur ; les petits écrans explorent les boucles horizontalement. */

<script>
const details = {"couches": {"title": "Couches", "intro": "Paralléliser les agents, limiter les conflits, vérifier plus facilement.", "items": [["Paralléliser en limitant les conflits", "Les sous-agents avancent sur les couches libres. Un seul agent écrit dans une couche à la fois ; l’agent suivant attend si elle est occupée ou contient des modifications en cours."], ["Vérifier plus facilement", "L’environnement de chaque couche permet d’observer le travail effectué et de produire les preuves de son fonctionnement."], ["Définir les périmètres", "Les responsabilités et les chemins autorisés séparent les contributions et contribuent à une architecture plus propre."], ["Isoler les ressources", "Branches, worktrees et environnements séparent les travaux. Ports, bases de données et fichiers générés doivent aussi être isolés pour limiter les interférences."], ["Clarifier les contrats et les dépendances", "Chaque couche sait ce qu’elle fournit aux autres et quels résultats elle doit attendre."], ["Tracer et réunir les contributions", "Une demande peut comporter plusieurs tâches par couche. Chaque tâche produit un commit distinct ; les commits sont réunis dans une PR correspondant à la demande initiale."]], "kind": "Le cadre AIDE", "description": "Chaque couche définit un périmètre de responsabilité, une branche, un worktree et un environnement isolé. Ce découpage clarifie les dépendances, protège le travail en cours et contribue à une architecture plus propre."}, "consolidation": {"title": "Consolidation", "intro": "Corriger toute la base et rendre les bonnes pratiques vérifiables.", "items": [["conventions techniques", "Les règles communes stabilisent les pratiques du projet."], ["Patterns éprouvés", "Les solutions récurrentes validées deviennent des références réutilisables."], ["Garde-fous", "Tests, vérificateurs et contrôles automatisés rendent les exigences vérifiables."]], "kind": "Le cadre AIDE", "description": "Les constats du développement deviennent des corrections, des conventions techniques et des garde-fous. Les règles retenues sont contrôlées par des tests et vérificateurs exécutables sans IA."}, "engineering": {"title": "IA Engineering", "intro": "Donner aux agents un cadre précis pour agir et savoir s’arrêter.", "items": [["Consignes des agents", "Instructions du projet dans AGENTS.md, configuration dans .codex/config.toml et procédures portées par les skills disponibles."], ["Missions et coordination", "Affectation des missions, périmètres autorisés et coordination du travail."], ["Exécution, validation et autorisations", "Règles qui précisent comment agir, prouver le résultat et obtenir les validations nécessaires."]], "kind": "Le cadre AIDE", "description": "Les consignes définissent comment recevoir une mission, respecter les périmètres, coordonner le travail, produire des preuves et demander les validations nécessaires."}, "documentation": {"title": "Documentation", "intro": "Rendre le projet compréhensible et chaque décision traçable.", "items": [["docs/", "Documentation du projet : fonctionnement, conventions techniques et décisions."], ["dev-book/", "Demandes, tâches, procédures et preuves."], ["**/README.md", "Définition des responsabilités et des conventions techniques des dossiers à chaque niveau de l’application."]], "kind": "Le cadre AIDE", "description": "La documentation décrit le fonctionnement du projet ; les demandes et tâches conservent les décisions et les preuves ; les README précisent les responsabilités des dossiers."}, "controles": {"title": "Codebase Quality Control", "kind": "Cadre humain · contrôles sans IA", "intro": "Les conventions techniques du projet et les points de contrôle qui vérifient leur application.", "items": [["Un contenu propre au projet et vivant", "Chaque projet possède son propre Codebase Quality Control. Comme la documentation, il est enrichi, réécrit et ajusté en permanence. Les conventions techniques peuvent être génériques, reprises d’autres projets ou propres au projet."], ["Une structure agnostique", "AIDE (AI Development Engineering) fournit la structure, quels que soient les langages et les technologies. Les stacks du boilerplate ne sont que des exemples."], ["Domaine → Conventions techniques (règles) → Points de contrôle", "Chaque convention technique appartient à un seul domaine. Elle précise la règle, le périmètre, les exceptions explicites et justifiées, les points de contrôle et le niveau de chaque contrôle."], ["15 domaines", "Règles métier · Données · Authentification et autorisations · Intégrations et échanges · Contrats et compatibilité · Parcours utilisateur · Interface et internationalisation · Accessibilité · Rendu visuel · Architecture et dépendances · Qualité du code · Sécurité · Performance et robustesse · Construction et livraison · Fiabilité des vérifications."], ["Bloquant ou informatif", "Un contrôle peut être bloquant lorsque l’écart est constaté sans ambiguïté. Il reste informatif lorsque le résultat nécessite une interprétation humaine."], ["Des conventions techniques avant leur automatisation", "Une convention technique peut être documentée dans un README sans point de contrôle implémenté. Cet état doit être visible."], ["Documenter sans dupliquer", "Les conventions techniques vivent au plus près du code, notamment dans les README ; la documentation centrale apporte les explications et les exemples. Une vue centrale par domaine référence les conventions techniques et leurs points de contrôle, sans recopier leur contenu."], ["Sans jugement d’IA", "L’IA peut écrire les contrôles ; ils sont exécutables sans jugement d’IA. Les vérificateurs spécifiques au projet sont eux-mêmes testés : ils doivent détecter les écarts et accepter les cas conformes."], ["La consolidation enrichit", "Après arbitrage humain, la consolidation ajoute, modifie ou retire des conventions techniques et adapte les points de contrôle associés."], ["L’exécution relève des autres briques", "Les moments d’exécution et les étapes bloquées sont définis par les autres briques du cadre AIDE."]]}, "demandes": {"title": "Demandes", "kind": "Humain · entrée", "intro": "Une ou plusieurs demandes alimentent les tâches de la boucle de codage.", "items": []}, "pr": {"title": "PRs", "kind": "IA · sortie", "intro": "Les PRs rassemblent les commits pour leur intégration. Leur ouverture est conditionnée à la réussite des contrôles déterministes.", "items": [["Passage obligatoire", "À l’étape 06, exécuter les contrôles et obtenir un résultat OK avant toute PR. Les exécutions faites pendant l’étape 03 aident au développement et ne suppriment pas ce passage final."]]}, "interview": {"title": "Interview", "kind": "IA", "intro": "L’IA transforme la demande en un besoin clair en questionnant l’humain jusqu’à lever les inconnues de cadrage.", "items": [["Préciser le besoin", "Problème à résoudre, résultat attendu et usages concernés."], ["Définir les limites", "Périmètre, exclusions, contraintes et critères permettant de reconnaître un résultat conforme."], ["Faire trancher les choix", "L’IA relève les ambiguïtés et propose des options ; les décisions de cadrage restent humaines."], ["Sortie attendue", "Une demande documentée, prête à être découpée en tâches si l’humain décide de la réaliser."]]}, "decoupage": {"title": "Découpage", "kind": "IA", "intro": "L’IA décompose la demande cadrée en tâches, puis les répartit entre les couches concernées. Une même couche peut recevoir plusieurs tâches.", "items": [["Délimiter chaque tâche", "Objectif, périmètre, exclusions, critères de réussite et preuves attendues."], ["Organiser les dépendances", "Déterminer l’ordre des tâches et celles qui peuvent avancer indépendamment."], ["Préserver la traçabilité", "Chaque tâche reste rattachée à la demande initiale et produit un commit distinct."], ["Sortie attendue", "Des cartes de tâches réparties et ordonnées par couche. Leurs commits seront réunis dans une PR correspondant à la demande initiale."]]}, "realisation": {"title": "Implémentation", "kind": "IA", "intro": "L’IA réalise chaque tâche dans le périmètre de sa couche, avec sa branche et son worktree isolés. La boucle de développement ne modifie aucun élément du dossier codebase-quality-control/.", "items": [["Respecter la disponibilité", "Un seul agent écrit dans une couche à la fois. Si elle est occupée ou contient des modifications en cours, l’agent suivant attend."], ["Coder le changement attendu", "Suivre la carte de tâche et les conventions techniques, sans modification hors périmètre. Les couches libres peuvent avancer en parallèle."], ["Vérifier et montrer le résultat", "Lancer les contrôles déterministes pertinents, corriger les échecs et présenter des preuves observables, avec les vérifications effectuées et les limites restantes."], ["Sortie attendue", "Un changement prêt pour la vérification humaine. L’agent conserve la couche pendant les éventuelles corrections."]]}, "finalisation": {"title": "Livraison", "kind": "IA", "intro": "L’IA finalise la contribution complète pour préparer une PR correspondant à la demande initiale.", "items": [["Faire passer le Codebase Quality Control", "Vérifier l’ensemble reconstitué, corriger les échecs et relancer les contrôles concernés jusqu’à leur réussite."], ["Écrire les tests et la documentation", "Une fois les contrôles réussis, couvrir les nouveaux comportements et documenter les changements. Exécuter les tests ajoutés."], ["Préparer la PR", "Présenter le besoin traité, les changements, les vérifications effectuées et les éventuelles limites."], ["Sortie attendue", "Une contribution contrôlée, testée et documentée, prête à être proposée en PR. Aucune PR sans contrôles réussis."]]}, "reconstitution": {"title": "Reconstitution", "kind": "IA", "intro": "L’IA rassemble les commits des tâches validées pour reconstituer l’ensemble du changement correspondant à la demande initiale.", "items": [["Vérifier la complétude", "Toutes les tâches attendues sont validées et possèdent chacune leur commit."], ["Réunir les contributions", "Intégrer les commits des couches concernées sur une seule branche, en respectant leurs dépendances et en résolvant les éventuels conflits."], ["Vérifier l’ensemble", "Faire fonctionner les contributions réunies et contrôler leurs échanges. Un environnement de preview permet d’observer le résultat global."], ["Sortie attendue", "Une branche réunissant les changements de la demande initiale, prête pour la livraison et la préparation d’une PR unique."]]}, "verification": {"title": "Vérification", "kind": "Humain", "intro": "L’humain examine le résultat et les preuves présentés par l’IA pour vérifier deux points : la tâche produit le résultat annoncé et le code reste cohérent avec la trajectoire du projet.", "items": [["Vérifier le résultat", "Confronter le comportement observé aux critères de la tâche, en s’appuyant sur les preuves et l’application disponible."], ["Examiner la cohérence", "Repérer les écarts de périmètre, les incohérences et les pratiques qui contredisent les conventions techniques du projet."], ["Donner un verdict", "Valider le changement ou demander des corrections. Une correction renvoie à la Implémentation, puis à une nouvelle vérification humaine."], ["Alimenter la consolidation", "Si le constat mérite une correction globale ou une nouvelle règle, formuler une demande de consolidation."], ["Sortie attendue", "Un verdict explicite pour chaque tâche. Les tâches validées donnent chacune lieu à un commit ; les demandes de consolidation sont transmises au processus dédié."]]}, "demande-consolidation": {"title": "Demande de consolidation", "kind": "Humain · liaison", "intro": "La vérification humaine peut alimenter les demandes de consolidation.", "items": [["Constat", "Une incohérence, une erreur ou une bonne pratique à généraliser est relevée."], ["Deux suites distinctes", "Corriger la tâche renvoie à la Implémentation ; faire évoluer le cadre déclenche une demande de consolidation."]]}, "demandes-consolidation": {"title": "Demandes de consolidation", "kind": "Humain · entrée", "intro": "Demandes issues de la vérification humaine ou d’une session de relecture.", "items": [["Examen", "Le constat est analysé avant de décider si une correction, une règle ou les deux sont pertinentes."], ["Périmètre global", "Même si le constat initial est local, la consolidation vérifie son application à toute la base de code."]]}, "pr-consolidation": {"title": "PRs de consolidation", "kind": "IA · sortie", "intro": "Corrections et refactorisations du code à l’échelle du projet.", "items": [["Corrections globales", "La consolidation vérifie toute la base de code et corrige les occurrences concernées dans l’ensemble du projet."], ["Résultat durable", "Les corrections et refactorisations sont accompagnées des tests et vérificateurs qui empêchent le retour des écarts retenus."], ["Contrôles avant PR", "Les PRs de consolidation sont elles aussi soumises à des contrôles réussis avant leur ouverture."]]}, "regles-controles": {"title": "Règles et contrôles", "kind": "IA · sortie après validation humaine", "intro": "Règles validées et contrôles ajoutés aux vérifications automatiques.", "items": [["Formaliser", "La règle est examinée, documentée et validée par l’humain."], ["Automatiser", "Les règles retenues sont traduites en nouveaux tests ou vérificateurs déterministes. L’IA peut les écrire, mais leur exécution doit être indépendante de l’IA."], ["Exécuter", "Les contrôles sont exécutables sans IA en CI/CD ou à la demande."], ["Boucle suivante", "Le code corrigé et les contrôles enrichis alimentent les prochaines vérifications de la boucle de codage."]]}, "process-consolidation": {"title": "Consolidation déterministe", "kind": "Processus de consolidation", "intro": "Vérifier et corriger toute la base de code, puis renforcer les contrôles exécutables sans IA.", "items": [["Examiner toute la base", "La demande peut partir d’un problème local. La consolidation recherche sa présence dans l’ensemble du projet : const panel = document.querySelector('#detail-panel');
const triggers = [...document.querySelectorAll('[data-detail]')];
let active = null;
function show(trigger) {
  active = trigger;
  const data = details[trigger.dataset.detail];
  document.querySelector('#detail-title').textContent = data.title;
  document.querySelector('#detail-kind').textContent = data.kind;
  const intro = document.querySelector('#detail-intro');
  intro.textContent = data.intro;
  intro.classList.toggle('is-hook', Boolean(data.description));
  const description = document.querySelector('#detail-description');
  description.textContent = data.description || '';
  description.hidden = !data.description;
  const list = document.querySelector('#detail-list');
  list.replaceChildren(...data.items.map(([title, text]) => {
    const item = document.createElement('li');
    const heading = document.createElement('h3'); heading.textContent = title;
    const paragraph = document.createElement('p'); paragraph.textContent = text;
    item.append(heading, paragraph); return item;
  }));
  triggers.forEach(button => button.setAttribute('aria-expanded', String(button === trigger)));
  panel.hidden = false;
  document.body.classList.add('panel-open');
}
function close() {
  const previous = active;
  active = null;
  panel.hidden = true;
  document.body.classList.remove('panel-open');
  triggers.forEach(button => button.setAttribute('aria-expanded', 'false'));
  previous?.focus({preventScroll:true});
}
triggers.forEach(trigger => {
  trigger.addEventListener('click', () => show(trigger));
});
document.querySelector('.close').addEventListener('click', close);
document.addEventListener('keydown', event => { if (event.key === 'Escape' && !panel.hidden) { event.preventDefault(); close(); } });
const routeHost = document.querySelector('.loops');
const routeSource = document.querySelector('[data-detail="verification"]');
const routeTarget = document.querySelector('[data-detail="demandes-consolidation"]');
function updateRequestRoute() {
  const host = routeHost.getBoundingClientRect();
  const from = routeSource.getBoundingClientRect();
  const to = routeTarget.getBoundingClientRect();
  const x1 = from.right - host.left + 2;
  const y1 = from.top + from.height / 2 - host.top;
  const x2 = to.left - host.left;
  const y2 = to.top + to.height / 2 - host.top;
  const middle = (x1 + x2) / 2;
  const segment = (selector, x, y, width, height) => Object.assign(document.querySelector(selector).style, {left:x+'px',top:y+'px',width:Math.max(0,width)+'px',height:Math.max(0,height)+'px'});
  segment('.route-start',x1,y1,middle-x1,1.5);
  segment('.route-middle',middle,Math.min(y1,y2),1.5,Math.abs(y1-y2));
  segment('.route-end',middle,y2,x2-middle,1.5);
}
const routeObserver = new ResizeObserver(updateRequestRoute);
[routeHost,routeSource,routeTarget].forEach(element => routeObserver.observe(element));
document.fonts.ready.then(updateRequestRoute);
