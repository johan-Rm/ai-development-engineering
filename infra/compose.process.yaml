services:
  witness:
    image: ${PROCESS_CHECK_IMAGE:?}
    command: [httpd, -f, -p, '8080', -h, /proof]
    read_only: true
    ports:
      - '127.0.0.1:${PROCESS_CHECK_PORT:?}:8080'
    volumes:
      - type: bind
        source: ${PROCESS_CHECK_PROOF_DIR:?}
        target: /proof
        read_only: true
        bind:
          create_host_path: false
      - state:/data
    tmpfs:
      - /tmp
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/identity.json]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: 'no'
volumes:
  state:
